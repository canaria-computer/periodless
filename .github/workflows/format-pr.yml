name: Format PR Automation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  group: format-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup-on-close:
    name: Cleanup Format PR on Close
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'automation/format-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Close format PR and delete branch if present
        run: |
          FORMAT_BRANCH="automation/format-pr-${PR_NUMBER}"
          EXISTING_PR=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${FORMAT_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${EXISTING_PR}" ]; then
            gh pr close "${EXISTING_PR}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "元の PR (#${PR_NUMBER}) が終了したため、この整形用 PR を自動で閉じます。"
          fi

          if git ls-remote --exit-code "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${FORMAT_BRANCH}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${FORMAT_BRANCH}" || true
          fi

  propose-format-pr:
    name: Propose Format PR
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'automation/format-')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run deno fmt
        run: deno fmt

      - name: Check original PR state
        id: original-pr
        run: |
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")

          CURRENT_STATE=$(jq -r '.state' <<< "${PR_JSON}")
          CURRENT_SHA=$(jq -r '.head.sha' <<< "${PR_JSON}")
          CURRENT_BRANCH=$(jq -r '.head.ref' <<< "${PR_JSON}")

          if [ "${CURRENT_STATE}" != "open" ] ||
             [ "${CURRENT_SHA}" != "${TARGET_SHA}" ] ||
             [ "${CURRENT_BRANCH}" != "${TARGET_BRANCH}" ]; then
            echo "Original PR changed or closed. Skipping."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "proceed=true" >> "${GITHUB_OUTPUT}"

      - name: Create or update signed format PR
        if: steps.original-pr.outputs.proceed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ env.TARGET_BRANCH }}
          branch: automation/format-pr-${{ env.PR_NUMBER }}
          delete-branch: true
          sign-commits: true
          commit-message: "style(format): deno fmtによる自動整形"
          title: "style(format): PR #${{ env.PR_NUMBER }} の自動整形"
          body: |
            PR #${{ env.PR_NUMBER }} で未整形のファイルが検出されたため、
            `deno fmt` による整形差分を提案します。

            この PR を `${{ env.TARGET_BRANCH }}` ブランチへマージすると、
            元の PR に整形結果が反映されます。

            関連 PR: #${{ env.PR_NUMBER }}
            整形元コミット SHA: `${{ env.TARGET_SHA }}`
