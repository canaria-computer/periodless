# 勘定科目ID（64bit整数型）定義ファイル
# 注意: 本定義（ビットレイアウト・流動性スコア・基底勘定科目番号）は設計途上の仕様であり、今後変更される可能性があります。

schema_version: 1
status: provisional

bit_layout:
  total_bits: 64
  rust_type: u64
  hex_pattern: "0xC000_LLLL_BBBB_0000"
  fields:
    - name: category
      description: 勘定区分（Category）
      bits: "63..=60"
      width: 4
      shift: 60
      mask: "0xF000_0000_0000_0000"
      values:
        "0001": { hex: "0x1", name_ja: "資産", type_name: "Asset" }
        "0010": { hex: "0x2", name_ja: "負債", type_name: "Liability" }
        "0011": { hex: "0x3", name_ja: "純資産", type_name: "Equity" }
        "0100": { hex: "0x4", name_ja: "費用", type_name: "Expense" }
        "0101": { hex: "0x5", name_ja: "収益", type_name: "Revenue" }
        "0110":
          {
            hex: "0x6",
            name_ja: "評価勘定科目（控除科目・特殊勘定）",
            type_name: "Valuation",
          }
    - name: reserved_1
      description: 将来予約（Reserved 1）
      bits: "59..=48"
      width: 12
      shift: 48
      mask: "0x0FFF_0000_0000_0000"
      value: "0x000"
    - name: liquidity_score
      description: 流動性スコア（Liquidity Score / 流動性配列法による降順ソート想定）
      bits: "47..=32"
      width: 16
      shift: 32
      mask: "0x0000_FFFF_0000_0000"
      anchors:
        max_super_liquidity: "0xFFFF"
        min_intangible_fixed_asset: "0x0001"
        not_applicable: "0x0000"
    - name: base_account_number
      description: 基底勘定科目番号（Base Account Number）
      bits: "31..=16"
      width: 16
      shift: 16
      mask: "0x0000_0000_FFFF_0000"
    - name: reserved_2
      description: 将来予約（Reserved 2 / 補助科目等の拡張用）
      bits: "15..=0"
      width: 16
      shift: 0
      mask: "0x0000_0000_0000_FFFF"
      value: "0x0000"

